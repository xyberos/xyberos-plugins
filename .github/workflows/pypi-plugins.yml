name: pypi-plugins

# Automatically publish the Xyberos plugin packages to PyPI.
#
# How each plugin gets "addressed" (routed to its own PyPI project):
#   - A "select" job computes which plugin directories to publish (from the
#     manual input or the pushed tag), then a job matrix runs one build+upload
#     job per selected plugin directory.
#   - PyPI does the actual routing: each wheel/sdist embeds its project name
#     (e.g. xyberos_github-0.1.0-*.whl -> project "xyberos-github"), so PyPI
#     sends every upload to the project that matches that name. No per-plugin
#     target URL is needed in this file.
#   - Authentication uses Trusted Publishing (OIDC) - no API tokens in the
#     repo. For EACH "xyberos-*" project on PyPI, register this repo as a
#     trusted publisher:
#         Owner:  <your-github-org-or-user>
#         Repo:   xyberos-plugins
#         Workflow name: pypi-plugins.yml
#         Environment:   (leave blank)
#     Each project can only receive uploads from the matching matrix job.
#
# Triggers:
#   - Manual (workflow_dispatch): publish all, or a comma-separated subset of
#     directories, where each entry is a subject folder or one distribution
#     inside one.
#   - Tag push:
#       v0.1.0                      -> publish every distribution
#       github/v0.1.0               -> publish the "github" distribution
#       db/v0.1.0                   -> publish every distribution under "db/"
#       db/xyberos_postgres/v0.1.0  -> publish one distribution inside "db/"

on:
  workflow_dispatch:
    inputs:
      plugins:
        description: >-
          Comma-separated directories to publish, each a subject folder or one
          distribution inside one (e.g. "db,github,storage/xyberos_storage").
          Leave empty to publish every distribution.
        required: false
        type: string
        default: ''
  push:
    tags:
      - 'v*'        # e.g. v0.1.0                     -> every distribution
      - '*/v*'      # e.g. github/v0.1.0              -> one distribution
      - '*/*/v*'    # e.g. db/xyberos_postgres/v0.1.0 -> one distribution

permissions:
  contents: read
  id-token: write   # required for PyPI trusted publishing (OIDC)

concurrency:
  group: pypi-plugins-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Compute which plugin directories should be published in this run.
  # matrix is NOT available in a job-level `if`, so we select up front here
  # (using only the `github` context) and feed the result to the matrix.
  select:
    name: Select plugins to publish
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.select.outputs.plugins }}
    steps:
      # The selection is read from the tree, so the tree has to be present. Without this the globs find
      # nothing, nothing matches the input, and the matrix comes out empty — which GitHub fails on with no
      # publish job at all, so the run reports "failure" and names no cause.
      - name: Checkout
        uses: actions/checkout@v4

      - name: Determine which plugins to publish
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          DISPATCH_INPUT: ${{ github.event.inputs.plugins }}
        run: |
          python - <<'PYEOF'
          import json
          import os
          import pathlib

          def discover():
              """Every directory that ships a distribution.

              A plugin folder carries its distribution directly (`github/`), and a
              subject folder carries one or more inside it (`db/xyberos_postgres/`).
              Discovered rather than listed, because a list written by hand misses the
              distribution nobody remembered to add to it.
              """
              found = set()
              for pattern in ("*/pyproject.toml", "*/*/pyproject.toml"):
                  for path in pathlib.Path(".").glob(pattern):
                      directory = path.parent.as_posix().removeprefix("./")
                      if not directory.startswith("."):
                          found.add(directory)
              return sorted(found)

          all_plugins = discover()
          print(f"discovered {len(all_plugins)}: {all_plugins}")
          if not all_plugins:
              raise SystemExit(
                  "no distribution found in the workspace: the checkout step is what puts them there, "
                  "and an empty matrix fails the run with no publish job to show why"
              )

          def under(name):
              """What `name` selects: the directory itself, or anything inside it.

              A name may be a path (`templates`, `db/xyberos_postgres`) or a
              distribution's own directory name (`xyberos_postgres`), spelled with
              underscores or the hyphens PyPI uses, because each is what a person types.
              """
              wanted = {name, name.replace("-", "_")}
              return [
                  directory
                  for directory in all_plugins
                  if directory in wanted
                  or any(directory.startswith(f"{prefix}/") for prefix in wanted)
                  or directory.split("/")[-1] in wanted
              ]

          def selected_or_fail(names):
              """Resolve names to directories, and refuse rather than guess.

              There is no fallback to "every distribution": a typo that silently published
              all 23 is worse than a failed run that lists what it knows about.
              """
              selected = sorted({directory for name in names for directory in under(name)})
              if not selected:
                  known = ", ".join(all_plugins)
                  raise SystemExit(
                      f"nothing matches {', '.join(repr(name) for name in names)}; "
                      f"the known directories are: {known}"
                  )
              return selected

          event = os.environ["EVENT_NAME"]
          ref = os.environ["GITHUB_REF"]
          dispatch_input = os.environ.get("DISPATCH_INPUT", "")

          if event == "workflow_dispatch":
              # Manual run: an empty input means every distribution; otherwise the
              # named directories, where naming a subject publishes what is inside it.
              names = [p.strip().strip("/") for p in dispatch_input.split(",") if p.strip()]
              selected = all_plugins if not names else selected_or_fail(names)
          else:
              # Tag push: the tag names a directory, and the version is its last segment.
              #   db/xyberos_postgres/v0.1.0 -> db/xyberos_postgres
              #   db/v0.1.0                  -> every distribution under db/
              #   v0.1.0                     -> every distribution
              tag = ref[len("refs/tags/"):]
              selected = (
                  all_plugins if "/" not in tag else selected_or_fail([tag.rsplit("/", 1)[0]])
              )

          print(f"selected {len(selected)}: {selected}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("plugins=" + json.dumps(selected) + "\n")
          PYEOF

  publish:
    name: Publish ${{ matrix.plugin }}
    needs: select
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # one plugin failing must not block the others
      matrix:
        plugin: ${{ fromJSON(needs.select.outputs.plugins) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build sdist and wheel
        working-directory: ${{ matrix.plugin }}
        run: |
          python -m pip install --upgrade pip build
          python -m build

      # Blocking: the PEP 561 marker is part of the published contract. Without
      # it, strict-mode Pylance reports reportMissingTypeStubs for every
      # consumer (`from xyberos_x import ...`). Stdlib-only and deterministic,
      # so it is safe to fail the release on.
      - name: Verify PEP 561 marker ships in artifacts
        working-directory: ${{ matrix.plugin }}
        run: |
          python - <<'PYEOF'
          import pathlib, sys, tarfile, zipfile

          wheel, = pathlib.Path("dist").glob("*.whl")
          sdist, = pathlib.Path("dist").glob("*.tar.gz")
          in_wheel = any(n.endswith("/py.typed") for n in zipfile.ZipFile(wheel).namelist())
          in_sdist = any(n.endswith("/py.typed") for n in tarfile.open(sdist).getnames())
          print(f"{wheel.name}: py.typed={in_wheel}")
          print(f"{sdist.name}: py.typed={in_sdist}")
          sys.exit(0 if in_wheel and in_sdist else 1)
          PYEOF

      # Blocking: a type regression fails the release instead of shipping. The distribution is installed
      # before it is checked, so strict mode sees the dependencies and the core range it declares — this
      # repository holds two lines, and a 2.x distribution checked against 1.x would be checked against
      # code it never runs on. A 2.x distribution cannot resolve its range before the core release exists,
      # and failing here is the correct ordering rather than a gap. If pyright or PyPI are ever unreachable
      # this will block publication; re-add `continue-on-error: true` to downgrade it to advisory-only.
      #
      # The check is scoped to the package rather than the whole directory, which the distribution's own
      # metadata names. The tests are each package's own CI's business: three of the seven need a live
      # service to run at all, and their type-cleanliness is a separate job rather than a publish gate.
      # Note the assignment below: a variable written to `$GITHUB_ENV` is only in scope for *later* steps,
      # so the import root is computed in the shell that uses it.
      - name: Type check distribution (strict)
        working-directory: ${{ matrix.plugin }}
        run: |
          python -m pip install pyright -e .
          package=$(python -c "import pathlib, tomllib; data = tomllib.loads(pathlib.Path('pyproject.toml').read_text()); project = data['project']; packages = data.get('tool', {}).get('setuptools', {}).get('packages'); print(packages[0] if packages else project['name'].replace('-', '_'))")
          python -m pyright "$package"

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ matrix.plugin }}/dist
          # Skip versions that are already on PyPI instead of failing the
          # whole matrix. Remove this to make "already exists" an error.
          skip-existing: true
          # Dry-run against Test PyPI (no real upload) while testing:
          # repository-url: https://test.pypi.org/legacy/
          #
          # Alternative auth (if you don't use Trusted Publishing):
          #   username: __token__
          #   password: ${{ secrets.PYPI_API_TOKEN }}

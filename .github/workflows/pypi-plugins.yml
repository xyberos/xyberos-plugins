name: pypi-plugins

# Automatically publish the Xyberos plugin packages to PyPI.
#
# How each plugin gets "addressed" (routed to its own PyPI project):
#   - A "select" job computes which plugin directories to publish (from the
#     manual input or the pushed tag), then a job matrix runs one build+upload
#     job per selected plugin directory.
#   - PyPI does the actual routing: each wheel/sdist embeds its project name
#     (e.g. xyberos_github-0.1.0-*.whl -> project "xyberos-github"), so PyPI
#     sends every upload to the project that matches that name. No per-plugin
#     target URL is needed in this file.
#   - Authentication uses Trusted Publishing (OIDC) - no API tokens in the
#     repo. For EACH "xyberos-*" project on PyPI, register this repo as a
#     trusted publisher:
#         Owner:  <your-github-org-or-user>
#         Repo:   xyberos-plugins
#         Workflow name: pypi-plugins.yml
#         Environment:   (leave blank)
#     Each project can only receive uploads from the matching matrix job.
#
# Triggers:
#   - Manual (workflow_dispatch): publish all, or a comma-separated subset.
#   - Tag push:
#       v0.1.0            -> publish ALL plugins
#       github/v0.1.0     -> publish only the "github" plugin

on:
  workflow_dispatch:
    inputs:
      plugins:
        description: >-
          Comma-separated plugin directories to publish
          (e.g. "github,http-api"). Leave empty to publish ALL plugins.
        required: false
        type: string
        default: ''
  push:
    tags:
      - 'v*'      # e.g. v0.1.0       -> all plugins
      - '*/v*'    # e.g. github/v0.1.0 -> one plugin

permissions:
  contents: read
  id-token: write   # required for PyPI trusted publishing (OIDC)

concurrency:
  group: pypi-plugins-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # Compute which plugin directories should be published in this run.
  # matrix is NOT available in a job-level `if`, so we select up front here
  # (using only the `github` context) and feed the result to the matrix.
  select:
    name: Select plugins to publish
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.select.outputs.plugins }}
    steps:
      - name: Determine which plugins to publish
        id: select
        env:
          EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          DISPATCH_INPUT: ${{ github.event.inputs.plugins }}
        run: |
          python - <<'PYEOF'
          import json
          import os

          all_plugins = [
              "auth", "db", "discord", "documents", "github", "gitlab",
              "http-api", "jira", "linear", "llm-providers", "mcp",
              "notion", "observability", "queues", "slack", "storage",
              "stt", "tts", "vector-faiss", "vector-qdrant", "vector-redis",
              "vision", "web-search",
          ]

          event = os.environ["EVENT_NAME"]
          ref = os.environ["GITHUB_REF"]
          dispatch_input = os.environ.get("DISPATCH_INPUT", "")

          if event == "workflow_dispatch":
              # Manual run: empty input = all plugins; otherwise only the
              # named ones. Fall back to all if nothing valid was given.
              if not dispatch_input.strip():
                  selected = all_plugins
              else:
                  chosen = [p.strip() for p in dispatch_input.split(",") if p.strip()]
                  selected = [p for p in all_plugins if p in chosen]
                  if not selected:
                      print("No valid plugins matched; publishing all.")
                      selected = all_plugins
          else:
              # Tag push: refs/tags/github/v0.1.0 -> github ; refs/tags/v0.1.0 -> all
              tag = ref[len("refs/tags/"):]
              if "/" in tag:
                  plugin = tag.split("/", 1)[0]
                  selected = [plugin] if plugin in all_plugins else all_plugins
              else:
                  selected = all_plugins

          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              f.write("plugins=" + json.dumps(selected) + "\n")
          PYEOF

  publish:
    name: Publish ${{ matrix.plugin }}
    needs: select
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false   # one plugin failing must not block the others
      matrix:
        plugin: ${{ fromJSON(needs.select.outputs.plugins) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Build sdist and wheel
        working-directory: ${{ matrix.plugin }}
        run: |
          python -m pip install --upgrade pip build
          python -m build

      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: ${{ matrix.plugin }}/dist
          # Skip versions that are already on PyPI instead of failing the
          # whole matrix. Remove this to make "already exists" an error.
          skip-existing: true
          # Dry-run against Test PyPI (no real upload) while testing:
          # repository-url: https://test.pypi.org/legacy/
          #
          # Alternative auth (if you don't use Trusted Publishing):
          #   username: __token__
          #   password: ${{ secrets.PYPI_API_TOKEN }}

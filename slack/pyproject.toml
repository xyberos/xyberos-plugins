[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xyberos-slack"
version = "0.1.0"
description = "Slack Web API plugin (RFC-0019, M7): post messages, list channels"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["xyberos>=1.0"]
keywords = ["xyberos", "plugin", "slack", "tool"]

[project.entry-points."xyberos.plugins"]
slack = "xyberos_slack.plugin:plugin"

[tool.setuptools]
packages = ["xyberos_slack"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

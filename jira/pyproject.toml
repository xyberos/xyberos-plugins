[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xyberos-jira"
version = "0.1.2"
description = "Jira REST API plugin (RFC-0019, M7): search and create issues"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["xyberos>=1.0,<2"]
keywords = ["xyberos", "plugin", "jira", "tool"]

[project.entry-points."xyberos.plugins"]
jira = "xyberos_jira.plugin:plugin"

[tool.setuptools]
packages = ["xyberos_jira"]

[tool.setuptools.package-data]
# PEP 561 marker: ships inline type annotations to consumers.
# Setuptools' default already includes it; declared explicitly so
# the intent survives a change to that default.
xyberos_jira = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

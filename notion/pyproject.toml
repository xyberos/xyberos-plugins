[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xyberos-notion"
version = "0.1.2"
description = "Notion API plugin (RFC-0019, M7): search + create pages"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["xyberos>=1.0,<2"]
keywords = ["xyberos", "plugin", "notion", "tool"]

[project.entry-points."xyberos.plugins"]
notion = "xyberos_notion.plugin:plugin"

[tool.setuptools]
packages = ["xyberos_notion"]

[tool.setuptools.package-data]
# PEP 561 marker: ships inline type annotations to consumers.
# Setuptools' default already includes it; declared explicitly so
# the intent survives a change to that default.
xyberos_notion = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

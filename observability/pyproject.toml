[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xyberos-observability"
version = "0.2.0"
description = "A logging handler and OpenTelemetry spans for Xyberos, fed by the runtime's own event sink"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["xyberos>=2,<3", "opentelemetry-api>=1.20,<2", "opentelemetry-sdk>=1.20,<2"]
keywords = ["xyberos", "observability", "opentelemetry", "tracing", "spans", "logging"]

[project.urls]
Documentation = "https://docs.xyberos.com/"
Repository = "https://github.com/xyberos/xyberos-plugins"
Issues = "https://github.com/xyberos/xyberos-plugins/issues"

[tool.setuptools]
packages = ["xyberos_observability"]

[tool.setuptools.package-data]
xyberos_observability = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xyberos-discord"
version = "0.1.0"
description = "Discord bot API plugin (RFC-0019, M7): send messages, get channels"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["xyberos>=1.0"]
keywords = ["xyberos", "plugin", "discord", "tool"]

[project.entry-points."xyberos.plugins"]
discord = "xyberos_discord.plugin:plugin"

[tool.setuptools]
packages = ["xyberos_discord"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

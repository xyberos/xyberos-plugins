[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xyberos-storage"
version = "0.1.0"
description = "Object storage plugin (RFC-0019, M9): S3, Azure Blob, GCS, OneDrive behind one ObjectStore contract"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["xyberos>=1.0"]
keywords = ["xyberos", "plugin", "storage", "s3", "azure", "gcs", "onedrive"]

[project.optional-dependencies]
s3 = ["boto3"]
azure = ["azure-storage-blob"]
gcs = ["google-cloud-storage"]
test = ["pytest"]

[project.entry-points."xyberos.plugins"]
storage = "xyberos_storage.plugin:plugin"

[tool.setuptools]
packages = ["xyberos_storage"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xyberos-mcp"
version = "0.3.1"
description = "The server direction: expose an application's registered tools to an MCP client over the core HTTP adapter"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["xyberos[http]>=2.1,<3"]
keywords = ["xyberos", "mcp", "model context protocol", "server", "tools", "expose"]

[project.urls]
Documentation = "https://docs.xyberos.com/"
Repository = "https://github.com/xyberos/xyberos-plugins"
Issues = "https://github.com/xyberos/xyberos-plugins/issues"

[tool.setuptools]
packages = ["xyberos_mcp"]

[tool.setuptools.package-data]
# PEP 561 marker: ships inline type annotations to consumers. Setuptools' default already includes
# it; declared explicitly so the intent survives a change to that default.
xyberos_mcp = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

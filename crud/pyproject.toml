[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xyberos-crud"
version = "0.1.0"
description = "Query construction over the provider contract: filtering, sorting, and pagination as values rather than entities"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["xyberos[database]>=2,<3", "sqlalchemy>=2.0,<2.1"]
keywords = ["xyberos", "crud", "filtering", "sorting", "pagination", "sqlalchemy"]

[project.urls]
Documentation = "https://docs.xyberos.com/"
Repository = "https://github.com/xyberos/xyberos-plugins"
Issues = "https://github.com/xyberos/xyberos-plugins/issues"

[tool.setuptools]
packages = ["xyberos_crud"]

[tool.setuptools.package-data]
xyberos_crud = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

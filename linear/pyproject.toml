[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xyberos-linear"
version = "0.1.1"
description = "Linear GraphQL plugin (RFC-0019, M7): search and create issues"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["xyberos>=1.0"]
keywords = ["xyberos", "plugin", "linear", "tool"]

[project.entry-points."xyberos.plugins"]
linear = "xyberos_linear.plugin:plugin"

[tool.setuptools]
packages = ["xyberos_linear"]

[tool.setuptools.package-data]
# PEP 561 marker: ships inline type annotations to consumers.
# Setuptools' default already includes it; declared explicitly so
# the intent survives a change to that default.
xyberos_linear = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

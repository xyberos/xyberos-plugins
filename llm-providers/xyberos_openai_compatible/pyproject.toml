[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xyberos-openai-compatible"
version = "0.1.1"
description = "A ModelProvider for OpenAI-compatible chat and embedding endpoints, proved against the shipped conformance suite"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["xyberos>=2.1,<3", "httpx>=0.27,<1"]
keywords = ["xyberos", "openai", "llm", "embeddings", "provider", "ai"]

[project.urls]
Documentation = "https://docs.xyberos.com/"
Repository = "https://github.com/xyberos/xyberos-plugins"
Issues = "https://github.com/xyberos/xyberos-plugins/issues"

[tool.setuptools]
packages = ["xyberos_openai_compatible"]

[tool.setuptools.package-data]
xyberos_openai_compatible = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xyberos-faiss"
version = "0.1.0"
description = "FAISS VectorStore plugin (RFC-0019, M4): local, dependency-free-of-server vector search"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["xyberos>=1.0"]
keywords = ["xyberos", "plugin", "vector", "faiss", "rag"]

[project.optional-dependencies]
vectors = ["faiss-cpu"]
test = ["pytest"]

[project.entry-points."xyberos.plugins"]
faiss = "xyberos_faiss.plugin:plugin"

[tool.setuptools]
packages = ["xyberos_faiss"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

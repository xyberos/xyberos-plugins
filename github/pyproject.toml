[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xyberos-github"
version = "0.1.1"
description = "GitHub REST plugin (RFC-0019, M7): user/repo/issue tools for Xyberos agents"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["xyberos>=1.0"]
keywords = ["xyberos", "plugin", "github", "tool"]

[project.entry-points."xyberos.plugins"]
github = "xyberos_github.plugin:plugin"

[tool.setuptools]
packages = ["xyberos_github"]

[tool.setuptools.package-data]
# PEP 561 marker: ships inline type annotations to consumers.
# Setuptools' default already includes it; declared explicitly so
# the intent survives a change to that default.
xyberos_github = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xyberos-postgres"
version = "0.1.0"
description = "A DatabaseProvider for PostgreSQL, proved against the shipped conformance suite"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["xyberos>=2,<3", "asyncpg>=0.29,<1", "sqlalchemy>=2.0,<2.1"]
keywords = ["xyberos", "postgres", "postgresql", "database", "provider"]

[project.urls]
Documentation = "https://docs.xyberos.com/"
Repository = "https://github.com/xyberos/xyberos-plugins"
Issues = "https://github.com/xyberos/xyberos-plugins/issues"

[tool.setuptools]
packages = ["xyberos_postgres"]

[tool.setuptools.package-data]
xyberos_postgres = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

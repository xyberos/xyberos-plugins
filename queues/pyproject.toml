[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xyberos-queues"
version = "0.1.0"
description = "Message queue plugin (RFC-0019, M9): Redis Streams, RabbitMQ, Kafka behind one MessageQueue contract"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["xyberos>=1.0"]
keywords = ["xyberos", "plugin", "queue", "redis", "rabbitmq", "kafka"]

[project.optional-dependencies]
redis = ["redis"]
rabbitmq = ["pika"]
kafka = ["kafka-python"]
test = ["pytest", "fakeredis"]

[project.entry-points."xyberos.plugins"]
queues = "xyberos_queues.plugin:plugin"

[tool.setuptools]
packages = ["xyberos_queues"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

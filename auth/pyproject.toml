[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "xyberos-auth"
version = "0.2.0"
description = "Verification only: an assertion from a shared secret or a JWKS, and a Principal"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
dependencies = ["xyberos>=2,<3", "cryptography>=42,<47"]
keywords = ["xyberos", "auth", "assertion", "jwt", "jws", "jwks", "verification", "principal"]

[project.urls]
Documentation = "https://docs.xyberos.com/"
Repository = "https://github.com/xyberos/xyberos-plugins"
Issues = "https://github.com/xyberos/xyberos-plugins/issues"

[tool.setuptools]
packages = ["xyberos_auth"]

[tool.setuptools.package-data]
xyberos_auth = ["py.typed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
